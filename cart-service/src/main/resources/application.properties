spring.application.name=cart-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:cartdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.topic.cart-events=${KAFKA_CART_EVENTS_TOPIC:cart.item.added}
spring.jpa.open-in-view=false
